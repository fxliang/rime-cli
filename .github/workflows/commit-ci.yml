name: commit-ci

permissions:
  contents: write

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
    tags:
      - '*'
  workflow_dispatch:

jobs:

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Install librime
        run: |
          cargo make pre-build

      - name: Build
        run: |
          cargo build --release --features=tui

      - name: Test
        run: cargo test --release

      - name: Prepare package
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: |
          cargo make package-release

      - name: Archive production artifacts
        if: runner.os == 'Windows' || runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: rime-cli-${{ runner.os }}
          path: rime-cli-${{ runner.os }}${{ runner.os == 'Windows' && '.7z' || '.tar.gz' }}

  nightly-release:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: rime-cli-macOS.tar.gz
          path: ./artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: rime-cli-Windows.7z
          path: ./artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: Nightly Release ${{ github.sha }}
          files: |
            ./artifacts/rime-cli-macOS.tar.gz
            ./artifacts/rime-cli-Windows.7z

